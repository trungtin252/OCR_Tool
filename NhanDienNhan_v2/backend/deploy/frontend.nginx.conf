server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The application uses BrowserRouter. Return the SPA entry point when a
    # browser opens a client-side URL directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
