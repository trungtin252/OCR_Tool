# Add this virtual host to the Nginx configuration used by container `o2n-web`.
# The OCR frontend must share the same Docker network and use the alias
# `ocr-frontend` (provided by frontend/docker-compose.yml).
server {
    listen 80;
    server_name ocrfe.o2n.ai.vn;

    client_max_body_size 256m;

    location / {
        proxy_pass http://ocr-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
