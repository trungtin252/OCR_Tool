# Starts only the OCR demo frontend. It does not alter or restart the backend.
# OCR_INGRESS_NETWORK must be the existing Docker network used by `o2n-web`.
services:
  frontend:
    image: nhan-dien-nhan-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://ocr.o2n.ai.vn}
    networks:
      ocr_ingress:
        aliases:
          - ocr-frontend
    restart: unless-stopped

networks:
  ocr_ingress:
    name: "${OCR_INGRESS_NETWORK:?Set OCR_INGRESS_NETWORK to the Docker network used by o2n-web.}"
    external: true
